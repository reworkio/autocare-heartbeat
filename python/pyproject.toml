[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocare-heartbeat"
version = "0.1.0"
description = "Tell AutoCare how each run of your automation went: one call, standard library only."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "REWORKIO" }]
keywords = ["autocare", "heartbeat", "monitoring", "automation"]

[project.urls]
Repository = "https://github.com/reworkio/autocare-heartbeat"

[tool.setuptools]
packages = ["autocare_heartbeat"]
